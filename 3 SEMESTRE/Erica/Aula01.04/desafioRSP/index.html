<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
</head>
<body>
    <form id="myForm">
        <input type="text" name="name" required>
        <button type="submit">Enviar</button>
    </form>
   
    <!-- Barra de progresso -->
    <div class="barraDeCarregamento">
        <div class="progress" id="Barra"></div>
    </div>

    <!-- Mensagem de sucesso (inicialmente oculta) -->
    <div class="success-message" id="successMessage" style="display: none;">Formulário enviado com sucesso!</div>

    <script src="script.js"></script>
</body>
</html>
