<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Requerimento</title>
</head>
<body>
   <div class="cont-esq">
        <div class="ID">
            <h3 class="txt-esq">ID</h3>
            <input type="text" id="id" name="id">
        </div> 
        <div class="Nome">
            <h3 class="txt-esq">Nome</h3>
            <input type="text" id="nome" name="nome">
        </div>
        <div class="Endereco">
            <h3 class="txt-esq">Endereco</h3>
            <input type="text" id="endereco" name="endereco">
        </div>
        <div class="Cidade">
            <h3 class="txt-esq">Cidade</h3>
            <input type="text" id="cidade" name="cidade">
        </div>
        <div class="Botoes">
            <button id="bt-nv" type="button">Novo</button>
            <button id="bt-edt" type="button">Editar</button>
            <button id="bt-exc" type="button">Excluir</button>
        </div>
    </div>
    <div class="cont-dir">
        <div class="lista">
            <ul id="lista-clientes">
               <h3>Lista de clientes</h3>
            </ul>

        </div>
    </div>
   <!----------------------------------------------------------------------------------- -->
   <!-- Modal simples -->
  <div id="modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3 id="modal-titulo">Deseja confirmar esta ação?</h3>
      <button id="modal-salvar">Salvar</button>
      <button id="modal-cancelar">Cancelar</button>
    </div>
   </div>
  <script src="script.js"></script>
</body>
</html>
